<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Redirect all paths to index.html for SPA routing on GitHub Pages
      var path = window.location.pathname;
      window.location.replace(path.split('/').slice(0, 2).join('/') + '/?p=' + encodeURIComponent(path));
    </script>
  </head>
</html>
